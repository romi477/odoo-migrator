[project]
name = "odoo-migrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7",
    "fastapi>=0.115",
    "httpx2>=2",
    "jinja2>=3.1",
    "peewee>=3.17",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    "pyyaml>=6",
    "anthropic>=0.40",
    "cursor-sdk>=1.0.32",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
odoo-migrator = "odoo_migrator.__main__:main"

[project.optional-dependencies]
# httpx2, not httpx: starlette>=1.0 imports httpx2 in starlette.testclient and
# warns that httpx is deprecated there.
dev = ["pytest>=8", "httpx2>=2", "ruff>=0.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# rules/, prompts/ and cartridges/ stay at the root of the checkout, where
# they are edited and reviewed. A wheel or a freeze has no checkout, so they
# ship inside the package under these names; `paths` looks in the checkout
# first. `packages.find` cannot map a directory to a package name, hence the
# explicit list.
[tool.setuptools]
packages = [
    "odoo_migrator",
    "odoo_migrator.provision",
    "odoo_migrator.runner",
    "odoo_migrator.runner.providers",
    "odoo_migrator.runner.steps",
    "odoo_migrator.sheller",
    "odoo_migrator.bundled_rules",
    "odoo_migrator.bundled_prompts",
    "odoo_migrator.bundled_cartridges",
]

[tool.setuptools.package-dir]
"odoo_migrator.bundled_rules" = "rules"
"odoo_migrator.bundled_prompts" = "prompts"
"odoo_migrator.bundled_cartridges" = "cartridges"

[tool.setuptools.package-data]
odoo_migrator = ["web/**/*"]
"odoo_migrator.bundled_rules" = ["*.md"]
"odoo_migrator.bundled_prompts" = ["*.md", "shell_overlay/*.md"]
"odoo_migrator.bundled_cartridges" = ["*.yaml"]

# `rules/AGENTS.md` is for whoever edits the rules, and it says so in its
# first line. The runtime never reads it — `assemble_rules` opens `common.md`
# and the version files — so a build has no use for it.
[tool.setuptools.exclude-package-data]
"odoo_migrator.bundled_rules" = ["AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests talk to whatever answers on 8765. Run by default, they made
# the suite depend on a daemon's load: a busy one timed out, and the suite
# is meant to pass with no daemon at all. `uv run pytest -m live` runs them.
addopts = ["-m", "not live"]
markers = [
    "live: talks to a Sheller daemon that may not be running",
]

[tool.ruff]
line-length = 100
