{# The two gears of the runner. The large one has twelve teeth, the small one
   eight, and the small one is turned half a tooth, so the teeth sit in each
   other's gaps on the line between the centres. The centres are 48 apart: a tip
   of one stops short of the root of the other (29 + 15 and 20 + 23 are 44 and
   43), so the teeth meet without sinking into each other. Turning them at 6s and 4s a
   turn keeps that fit (12:8), in opposite directions. Paths are generated, not
   drawn: `currentColor`, so the state of the machine colours them. The sparks at
   the mesh are drawn here too and hidden; the machine shows them while it
   works through a failure (data-lane). #}
