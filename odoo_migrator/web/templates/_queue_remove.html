{# Takes the last card back out of the queue. The button is on the last card
   only, and the page script draws the same one for a row it builds. #}
<button type="button" class="icon-danger queue-remove" data-queue-remove data-module="{{ mod.id }}"
        title="Remove {{ mod.technical_name }} from the queue"
        aria-label="Remove {{ mod.technical_name }} from the queue">
  {% include "_remove_icon.svg" %}
</button>
