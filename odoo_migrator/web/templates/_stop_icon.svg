{# A square, the usual stop: outlined like the play triangle it replaces on
   the module in work, with rounded corners. `currentColor`, so the button's
   colour rules apply. #}
<svg class="play-glyph stop-glyph" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linejoin="round" aria-hidden="true">
  <rect x="7" y="7" width="10" height="10" rx="2.5"></rect>
</svg>
