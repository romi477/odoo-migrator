<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    /* oklch(0.11 0.03 290) in sRGB — the same value as --background in
       style.css, inlined so the first paint is not white. Recompute this
       hex if that token ever moves. */
    html,
    body {
      background: #04030e;
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}odoo-migrator{% endblock %}</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/vendor/alpine.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app">
    <nav id="top">
      <a class="brand" href="/" title="Odoo Migrator">
        <img class="logo" src="/static/logo.svg" alt="" width="18" height="18">
        <span class="wordmark">odoo-migrator.<sub>v{{ version }}</sub></span>
      </a>
      <div class="nav-tabs">
        <a href="/"{% if active == 'overview' %} class="active"{% endif %} data-screen="overview" title="All migrations.">Overview</a>
        <span class="nav-divider" aria-hidden="true"></span>
        <a href="/tree"{% if active == 'tree' %} class="active"{% endif %} data-screen="tree" title="Module dependency tree for the open migration.">Tree</a>
        <span class="nav-divider" aria-hidden="true"></span>
        <a href="/run"{% if active == 'run' %} class="active"{% endif %} data-screen="run" title="Live pipeline workspace.">Run</a>
        <span class="nav-divider" aria-hidden="true"></span>
        <a href="/settings"{% if active == 'settings' %} class="active"{% endif %} data-screen="settings" title="App and migration settings.">Settings</a>
      </div>
      <div class="nav-end">
        <div
          class="migration-switcher"
          {% if current %}data-open-migration="{{ current.id }}"{% endif %}
          x-data="{ open: false }"
          @click.outside="open = false"
        >
          {% if current %}
          <button type="button" class="switcher-current" @click="open = !open">
            <span class="accent-dot" style="--accent: {{ current.accent_color }}"></span>
            <span class="name mono">{{ current.name }}</span>
          </button>
          {% elif migrations %}
          <button type="button" class="switcher-current" @click="open = !open">
            Pick a migration
          </button>
          {% endif %}
          {% if migrations %}
          <ul class="switcher-menu" x-show="open" x-cloak>
            {% for migration in migrations %}
            <li>
              <form method="post" action="/migrations/{{ migration.id }}/open">
                <button type="submit">
                  <span class="accent-dot" style="--accent: {{ migration.accent_color }}"></span>
                  <span class="name mono">{{ migration.name }}</span>
                  <span class="mono">{{ migration.source_version }} → {{ migration.target_version }}</span>
                </button>
              </form>
            </li>
            {% endfor %}
          </ul>
          {% endif %}
        </div>
        <a href="/styleguide"{% if active == 'styleguide' %} class="active"{% endif %} data-screen="styleguide" title="Every component rendered once, so the stylesheet is reviewable.">Styleguide</a>
        <a href="/attention" class="attention-lamp {{ lamp }}"
           title="{% if lamp == 'needs-attention' %}A module is waiting. Open it.{% else %}Nothing needs attention.{% endif %}">
          <span class="lamp-dot"></span>
        </a>
        <span class="running-count" data-running="{{ running_count }}"
              title="Migrations running.">{{ running_count }}</span>
      </div>
    </nav>
    <main class="shell">
      {% block screen %}{% endblock %}
    </main>
  </div>
  <script id="sse-hook" defer src="/static/sse.js"></script>
</body>
</html>
